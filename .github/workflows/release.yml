name: Release

# Attaches BeatThis.zip to the release of a version tag (e.g. 0.0.2). The updater (backend/updater.py)
# and the download link of the README take this file; the tag must equal the file VERSION.
on:
  release:
    types: [published]
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and version match
        run: test "$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Build the ZIP
        run: git archive --format=zip --prefix=BeatThis/ -o BeatThis.zip HEAD
      - name: Create the release if needed and attach the ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Changes: see CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" BeatThis.zip --clobber
